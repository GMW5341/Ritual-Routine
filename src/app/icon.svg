<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2330"/>
      <stop offset="100%" stop-color="#181d28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.3"/>
  <!-- Checkmark circle representing ritual/habit completion -->
  <circle cx="32" cy="30" r="16" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="85 15" opacity="0.9"/>
  <polyline points="24,30 30,36 40,24" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small dot accent -->
  <circle cx="32" cy="52" r="2.5" fill="#34d399" opacity="0.6"/>
</svg>
